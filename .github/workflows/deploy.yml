name: Deploy to Google Cloud Run

# Trigger robot hanya saat ada "git push" ke branch "main" (atau development)
on:
  push:
    branches:
      - main

# Mendefinisikan lingkungan kerja (menggunakan standar Ubuntu 2026 terbaru)
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Kloning kode sumber dari GitHub ke server robot
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login ke akun Docker Hub Anda
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Rakit (Build) dan Kirim (Push) image ke Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/acufara-ai-clinic:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/acufara-ai-clinic:${{ github.sha }}

      # 4. Otentikasi ke Google Cloud (Standar API V2 2026)
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 5. Rilis (Deploy) ke Cloud Run secara otomatis
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: acufara-ai-clinic
          region: asia-southeast2
          image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/acufara-ai-clinic:${{ github.sha }}
          flags: '--allow-unauthenticated --min-instances=0 --max-instances=5'
          # env_vars: |
          #   SERVER_NAME=:80

      # 6. Update image pada migration job & jalankan migration
      - name: Run Database Migration
        run: |
          gcloud run jobs update acufara-ai-clinic-migration \
            --region asia-southeast2 \
            --project juaravibecoding-202605 \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/acufara-ai-clinic:${{ github.sha }}
          gcloud run jobs execute acufara-ai-clinic-migration \
            --region asia-southeast2 \
            --project juaravibecoding-202605